name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Local-only credentials for the throwaway Postgres service below. Not secrets.
  DATABASE_URL: postgresql://groupsavings:change_me_local_only@localhost:5432/groupsavings
  JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-1234567
  DATA_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"

jobs:
  backend:
    name: API typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groupsavings
          POSTGRES_PASSWORD: change_me_local_only
          POSTGRES_DB: groupsavings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groupsavings -d groupsavings"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run test:db -w apps/api
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api

  frontend:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npm test -w apps/web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groupsavings
          POSTGRES_PASSWORD: change_me_local_only
          POSTGRES_DB: groupsavings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groupsavings -d groupsavings"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
